<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:762px;height:391px;background:#FFFFFF;" width="762px" height="391px" viewBox="0 0 762 391" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="4"><text x="207.035" y="24.533" fill="#000" font-size="14" textLength="341.523" font-weight="700">Undo and redo history after saved contact changes</text></g><g class="entity" data-qualified-name="Latest" id="ent0001" data-source-line="12"><rect x="553.5" y="249.609" width="132.062" height="90.438" fill="#F97181" style="stroke:#9D0012;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="553.5" y1="330.047" x2="685.562" y2="330.047" style="stroke:#9D0012;stroke-width:0.5;"/><text x="563.5" y="269.143" fill="#000" font-size="14" textLength="112.062">After two changes</text><text x="584.712" y="286.752" fill="#000" font-size="14" textLength="69.638">current = C</text><text x="578.864" y="304.361" fill="#000" font-size="14" textLength="81.334">undo = [A, B]</text><text x="593.653" y="321.971" fill="#000" font-size="14" textLength="51.755">redo = []</text></g><g class="entity" data-qualified-name="Undone" id="ent0002" data-source-line="13"><rect x="98" y="175.609" width="88.865" height="90.438" fill="#F97181" style="stroke:#9D0012;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="98" y1="256.047" x2="186.865" y2="256.047" style="stroke:#9D0012;stroke-width:0.5;"/><text x="110.133" y="195.143" fill="#000" font-size="14" textLength="64.6">After undo</text><text x="108" y="212.752" fill="#000" font-size="14" textLength="68.865">current = B</text><text x="110.324" y="230.361" fill="#000" font-size="14" textLength="64.217">undo = [A]</text><text x="111.5" y="247.971" fill="#000" font-size="14" textLength="61.865">redo = [C]</text></g><g class="entity" data-qualified-name="Branched" id="ent0003" data-source-line="14"><rect x="537" y="45.609" width="164.765" height="90.438" fill="#F97181" style="stroke:#9D0012;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="537" y1="126.047" x2="701.765" y2="126.047" style="stroke:#9D0012;stroke-width:0.5;"/><text x="547" y="65.143" fill="#000" font-size="14" textLength="144.765">After branching change</text><text x="584.563" y="82.752" fill="#000" font-size="14" textLength="69.638">current = D</text><text x="578.715" y="100.361" fill="#000" font-size="14" textLength="81.334">undo = [A, B]</text><text x="593.505" y="117.971" fill="#000" font-size="14" textLength="51.755">redo = []</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="22"><path d="M6,301.109 L6,376.516 A0,0 0 0 0 6,376.516 L279.173,376.516 A0,0 0 0 0 279.173,376.516 L279.173,311.109 L269.173,301.109 L146.5,301.109 L142.5,265.719 L138.5,301.109 L6,301.109 A0,0 0 0 0 6,301.109" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M269.173,301.109 L269.173,311.109 L279.173,311.109 L269.173,301.109" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="319.604" fill="#000" font-size="13" textLength="252.173">The rightmost entry is the top of each stack.</text><text x="19.22" y="335.956" fill="#000" font-size="13" textLength="237.732">A, B, and C are saved contact states with</text><text x="26.825" y="352.308" fill="#000" font-size="13" textLength="222.523">selection, filter, sort, and activity times.</text><text x="13.438" y="368.659" fill="#000" font-size="13" textLength="249.298">A failed redo save also returns to this state.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="29"><path d="M491,171.109 L491,213.813 A0,0 0 0 0 491,213.813 L747.593,213.813 A0,0 0 0 0 747.593,213.813 L747.593,181.109 L737.593,171.109 L623.5,171.109 L619.5,135.879 L615.5,171.109 L491,171.109 A0,0 0 0 0 491,171.109" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M737.593,171.109 L737.593,181.109 L747.593,181.109 L737.593,171.109" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="506.414" y="189.604" fill="#000" font-size="13" textLength="216.766">The new mutation clears redo history.</text><text x="497" y="205.956" fill="#000" font-size="13" textLength="235.593">The discarded C state cannot be redone.</text></g><!--link Latest to Undone--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="16" data-link-type="dependency"><path d="M553.3,303.709 C490.04,310.559 391.76,315.969 309,297.609 C294.64,294.419 292.34,289.819 279,283.609 C248.31,269.309 218.234,255.326 191.674,242.986" style="stroke:#181818;stroke-width:1;" fill="none" id="Latest-to-Undone"/><polygon points="187.14,240.879,193.617,248.299,191.674,242.986,196.987,241.044,187.14,240.879" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="364.956" y="278.104" fill="#000" font-size="13" textLength="40.422" font-weight="700">undo()</text><text x="327" y="294.456" fill="#000" font-size="13" textLength="116.333" font-weight="700">restore B and save</text></g><!--link Undone to Latest--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk5" data-source-line="17" data-link-type="dependency"><path d="M187.09,224.619 C248.46,230.569 363.72,242.869 461,259.609 C491.5,264.859 520.149,270.973 548.389,277.503" style="stroke:#181818;stroke-width:1;" fill="none" id="Undone-to-Latest"/><polygon points="553.26,278.629,545.393,272.705,548.389,277.503,543.59,280.499,553.26,278.629" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="366.752" y="218.104" fill="#000" font-size="13" textLength="36.829" font-weight="700">redo()</text><text x="327" y="234.456" fill="#000" font-size="13" textLength="116.333" font-weight="700">restore C and save</text></g><!--link Undone to Branched--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="18" data-link-type="dependency"><path d="M187.34,208.609 C266.8,186.859 430.947,141.939 532.157,114.239" style="stroke:#181818;stroke-width:1;" fill="none" id="Undone-to-Branched"/><polygon points="536.98,112.919,527.243,111.437,532.157,114.239,529.355,119.153,536.98,112.919" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="310" y="117.104" fill="#000" font-size="13" textLength="150.992" font-weight="700">new real contact change</text><text x="339.599" y="133.456" fill="#000" font-size="13" textLength="91.793" font-weight="700">save succeeds</text></g><!--link Undone to Undone--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk7" data-source-line="19" data-link-type="dependency"><path d="M97.93,177.399 C93.37,157.719 108.23,140.609 142.5,140.609 C176.77,140.609 192.759,152.848 188.199,172.528" style="stroke:#181818;stroke-width:1;" fill="none" id="Undone-to-Undone"/><polygon points="187.07,177.399,192.998,169.535,188.199,172.528,185.205,167.729,187.07,177.399" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="50.5" y="116.104" fill="#000" font-size="13" textLength="184.171" font-weight="700">read-only or no-op command;</text><text x="68.531" y="132.456" fill="#000" font-size="13" textLength="148.11" font-weight="700">failed command or save</text></g><?plantuml-src XLF1Rjim3BthAxZkiW59i5qxj43jTgSC0RRkD1U58j6nK9aA9Bf1CEpVHybEuQm3wfDjlVVuo4UzSsJyO14I7pskzaFlbSUMWGD4j-iOh8jes0LIYXrxX9za0sYo455UEfSun2FebZ52qizemGHYRHXCfsc7IQdqv6Yle-xX1sj6-Ar0dagRfrqC0zaw-13Xs-RsRlrORzQRxu_tdqT8Y1RZg-DozbMgZ2VlFvL7_P5AHV_YfhZXGpXvQCWCCI8nN47Tq91xk89VDmke7XegdSZdmmNe16kHI7mkbGbpZMgcCHEeHuKy8i9pXMtKP3f7kydINEts3KTLuQ9LQlG6o-NrL0GkYxSF7pCdHu5GbNHo56h2PFZ4l2onpU7rV-6daa8WF0X9-tzoRIXp80t68Deq9xzO4vfT1l97a9WeBCDUHFfU2dvfgDNEbsqfFpAYc50KP6hRm1nw2Erfc03t7OuxsGTfH2OdQ-SIiFnc